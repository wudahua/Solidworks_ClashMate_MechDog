name: Validate public release sources
on: [push, pull_request]
jobs:
  source-integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements.lock.txt
      # Includes actual no-CAD register/query and SID fixtures in test_v043a9.
      # Only interactive RunEx/stdio cases report an explicit Session-0 skip.
      - run: python -m unittest discover -s tests -p "test_*.py"
      # Compile pure production C# policies using the Windows .NET compiler.
      # These checks do not load interop DLLs, enumerate live CAD, or require SolidWorks.
      - run: python tests/run_offline_policies.py
