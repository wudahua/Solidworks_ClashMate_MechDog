name: Validate public release sources
on: [push, pull_request]
jobs:
  source-integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      # Compile pure production C# policies using the Windows .NET compiler.
      # These checks do not load interop DLLs, enumerate live CAD, or require SolidWorks.
      - run: python tests/alpha5_evidence_checks.py
      - run: python tests/session_connection_checks.py
      - run: python tests/axis_convention_checks.py
      - run: python tests/installation_powershell_checks.py
      - run: python tests/alpha8_policy_checks.py
      - run: python tests/alpha9_policy_checks.py
      - run: python tests/study_history_v04.py
